apiVersion: v1
kind: Service
metadata:
  name: mysqldb
spec:
  clusterIP: None
  selector: { app: mysqldb }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysqldb
spec:
  serviceName: mysqldb
  replicas: 1
  selector: { matchLabels: { app: mysqldb } }
  template:
    metadata:
      labels: { app: mysqldb }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.32
          args: ["--default-authentication-plugin=mysql_native_password"]
          ports: [{ containerPort: 3306 }]
          envFrom:
            - secretRef: { name: mysql-secret }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            exec: { command: ["mysqladmin","ping","-h","localhost","-uroot","-proot"] }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources: { requests: { storage: 8Gi } }
