apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 8005, targetPort: 8005 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: {{ .Values.replicas.auth }}
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.ecrRegistry }}/zidd-auth-service:{{ .Values.imageTag }}"
          ports: [{ containerPort: 8005 }]
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysqldb:3306/spring_auth_api" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "root" }
            - { name: SPRING_JPA_HIBERNATE_DDL_AUTO, value: "update" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }
          envFrom:
            - secretRef: { name: auth-secret }
          readinessProbe:
            httpGet: { path: /auth/healthy, port: 8005 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /auth/healthy, port: 8005 }
            initialDelaySeconds: 70
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
