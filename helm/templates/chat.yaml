apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  selector: { app: chat-service }
  ports: [{ port: 8010, targetPort: 8010 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: {{ .Values.replicas.chat }}
  selector: { matchLabels: { app: chat-service } }
  template:
    metadata:
      labels: { app: chat-service }
    spec:
      containers:
        - name: chat-service
          image: "{{ .Values.ecrRegistry }}/zidd-chat-service:{{ .Values.imageTag }}"
          ports: [{ containerPort: 8010 }]
          env:
            - { name: SPRING_DATA_MONGODB_HOST, value: "mongodb" }
            - { name: SPRING_DATA_MONGODB_PORT, value: "27017" }
            - { name: SPRING_DATA_MONGODB_DATABASE, value: "spring_chat_app" }
            - { name: SPRING_DATA_REDIS_HOST, value: "redisdb" }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }
          readinessProbe:
            httpGet: { path: /messages/healthy, port: 8010 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /messages/healthy, port: 8010 }
            initialDelaySeconds: 70
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
