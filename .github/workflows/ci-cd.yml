name: ZIDD2 CI/CD

on:
  push:
    branches: [dev, stage, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, stage, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  # ---- Pick environment from branch (or manual input) ----
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

# ---- Stage 1: Git leak scan ----
  git-leak:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

 # ---- Stage 2: Build (tests skipped - no DB on runner) ----
  unit-test:
    needs: git-leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build auth-service
        working-directory: auth-service
        run: mvn -B package -DskipTests
      - name: Build chat-service
        working-directory: chat-service
        run: mvn -B package -DskipTests

# ---- Stage 3: SonarQube scan ----
  sonar:
    needs: [setup, unit-test]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Scan auth-service
        working-directory: auth-service
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests
          -Dsonar.projectKey=zidd2-auth-${{ needs.setup.outputs.environment }}
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Scan chat-service
        working-directory: chat-service
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests
          -Dsonar.projectKey=zidd2-chat-${{ needs.setup.outputs.environment }}
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Scan frontend
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          projectBaseDir: chat-app-client
          args: >
            -Dsonar.projectKey=zidd2-frontend-${{ needs.setup.outputs.environment }}
            -Dsonar.sources=src
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Scan frontend
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          projectBaseDir: chat-app-client
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          


 # ---- Stage 4: Build & push images to ECR ----
  build-push:
    needs: [setup, sonar]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -t $ECR_REGISTRY/zidd-auth-service:$IMAGE_TAG ./auth-service
          docker push $ECR_REGISTRY/zidd-auth-service:$IMAGE_TAG
      - run: |
          docker build -t $ECR_REGISTRY/zidd-chat-service:$IMAGE_TAG ./chat-service
          docker push $ECR_REGISTRY/zidd-chat-service:$IMAGE_TAG
      - run: |
          docker build -t $ECR_REGISTRY/zid-frontend:$IMAGE_TAG ./chat-app-client
          docker push $ECR_REGISTRY/zid-frontend:$IMAGE_TAG

  # ---- Stage 5: Deploy to EKS with Helm ----
  deploy:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ vars.AWS_REGION }}
      - name: Helm deploy
        run: >
          helm upgrade --install zidd2 ./helm -n zidd2 --create-namespace
          --set ecrRegistry=$ECR_REGISTRY
          --set imageTag=$IMAGE_TAG
          --set mysql.rootPassword=${{ secrets.MYSQL_ROOT_PASSWORD }}
          --set auth.jwtSecret=${{ secrets.JWT_SECRET }}
          --wait --timeout 5m
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/auth-service -n zidd2 --timeout=180s
          kubectl rollout status deployment/chat-service -n zidd2 --timeout=180s
          kubectl rollout status deployment/frontend -n zidd2 --timeout=180s